  - "Taux CS16 indépendant par destination UDP, sans upsampling"
  - "Taille de datagramme et file UDP configurables"
  - "Édition des paramètres de destination dans la GUI"
constraints:
  - "RX uniquement; aucune autorité RF côté client"
