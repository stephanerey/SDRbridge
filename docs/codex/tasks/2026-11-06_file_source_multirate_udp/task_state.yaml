decisions:
  file_formats: "WAV/RF64 stereo: uint8, int16, int32, float32; SigMF conservé"
  stream_processing: "un pipeline DSP mutualisé par taux/format effectif"
  loopback_datagram_default: 8192
proof_plan:
  - "Vecteurs WAV pour chaque encodage et fréquence issue du nom/surcharge"
  - "Trois destinations simultanées 2 MHz, 192 kHz et 1 MHz"
  - "Mesure du nombre de datagrammes 1200 vs 8192 et absence de pertes"
  - "Tests Qt ajout/modification de destination"
remaining:
  - "Aucun pour le périmètre logiciel; build/installation et endurance restent des opérations séparées"
